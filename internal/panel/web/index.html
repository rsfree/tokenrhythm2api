<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenRhythm 号池管理</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>TokenRhythm 号池</h1>
    <span class="tag" id="upstreamTag">—</span>
  </div>
  <div class="topbar-right">
    <span class="muted" id="uptime">—</span>
    <button class="btn ghost" id="btnProbe">全部探活</button>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn ghost" id="btnLogout">退出</button>
  </div>
</header>

<main>
  <!-- 登录 -->
  <section class="login-card" id="loginCard" hidden>
    <h2>输入管理令牌</h2>
    <p class="muted">即 config 中的 <code>admin_key</code>，只存在本机浏览器。</p>
    <form id="loginForm">
      <input type="password" id="tokenInput" placeholder="admin_key" autocomplete="current-password" required>
      <button class="btn" type="submit">进入</button>
    </form>
    <p class="err" id="loginErr"></p>
  </section>

  <div id="app" hidden>
    <section class="cards">
      <div class="card">
        <div class="card-label">可用号 / 总数</div>
        <div class="card-value"><span id="kHealthy">0</span><small> / <span id="kTotal">0</span></small></div>
        <div class="card-sub" id="kStates">—</div>
      </div>
      <div class="card">
        <div class="card-label">请求总数</div>
        <div class="card-value" id="kRequests">0</div>
        <div class="card-sub" id="kSuccess">成功率 —</div>
      </div>
      <div class="card">
        <div class="card-label">累计消耗</div>
        <div class="card-value">¥<span id="kSpent">0.00</span></div>
        <div class="card-sub" id="kBudget">充值池 —</div>
      </div>
      <div class="card">
        <div class="card-label">今日</div>
        <div class="card-value">¥<span id="kTodayCost">0.00</span></div>
        <div class="card-sub" id="kTodayReq">— 次请求</div>
      </div>
    </section>

    <section class="access" id="accessBox"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>号池</h2>
        <div class="panel-actions">
          <button class="btn ghost small" id="btnAddToggle">+ 添加号</button>
        </div>
      </div>

      <form class="add-form" id="addForm" hidden>
        <input id="addName" placeholder="名称，如 主账号" autocomplete="off">
        <input id="addSecret" placeholder="sk_tr_..." autocomplete="off" spellcheck="false">
        <input id="addBudget" type="number" step="0.01" min="0" placeholder="充值额 ¥（可空）">
        <button class="btn small" type="submit">加入池</button>
        <span class="err" id="addErr"></span>
      </form>

      <div class="table-wrap">
        <table class="tbl" id="keyTable">
          <thead>
            <tr>
              <th>名称</th><th>状态</th><th class="w-balance">余额（本地记账）</th>
              <th class="num">请求</th><th class="num">错误</th><th class="num">Tokens</th>
              <th class="num">权重</th><th class="right">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint">
        余额 = 充值额 − 本网关按上游价目表累计的成本；未填充值额的号显示「未知」，不参与余额加权与保底。
      </p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>调度策略</h2>
        <div class="panel-actions">
          <button class="btn ghost small" id="btnPrices">刷新价目表</button>
          <button class="btn small" id="btnSavePool">保存</button>
        </div>
      </div>
      <div class="grid-form">
        <label>策略
          <select id="pStrategy">
            <option value="weighted_random">加权随机（推荐）</option>
            <option value="round_robin">轮询</option>
            <option value="sequential">顺序耗尽</option>
          </select>
        </label>
        <label>短名单宽度 TopK<input type="number" id="pTopK" min="1" max="20"></label>
        <label>单号并发上限<input type="number" id="pMaxInflight" min="0"></label>
        <label>重试次数<input type="number" id="pRetry" min="1" max="10"></label>
        <label>余额保底 ¥<input type="number" id="pFloor" step="0.1" min="0"></label>
        <label>闲置权重 / 小时<input type="number" id="pIdle" step="0.1" min="0"></label>
        <label>429 冷却（秒）<input type="number" id="pRate" min="1"></label>
        <label>熔断冷却（秒）<input type="number" id="pBreaker" min="1"></label>
      </div>
      <p class="hint" id="priceHint">价目表：—</p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>请求日志</h2><span class="muted" id="logHint"></span></div>
      <div class="table-wrap">
        <table class="tbl log" id="logTable">
          <thead><tr><th>时间</th><th>号</th><th>模型</th><th>状态</th><th class="num">耗时</th><th class="num">Tokens</th><th class="num">成本</th><th>备注</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" hidden></div>
<script src="./app.js"></script>
</body>
</html>
