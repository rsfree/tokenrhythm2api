# trpool HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trpool.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/trpool.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/trpool.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/trpool.1task.cn.log;
    error_log  /www/wwwlogs/trpool.1task.cn.error.log;

    auth_basic off;   # 显式声明：鉴权在服务侧（admin_key / client_keys）

    # 面板可用 ?token=<admin_key> 取用 ⇒ 关掉访问日志，别把管理令牌写进日志文件
    location ^~ /panel {
        access_log off;
        include /www/server/panel/vhost/nginx/trpool-proxy.inc;
    }

    # 健康检查对外无意义，留个轻量 200 给探针
    location = /healthz {
        access_log off;
        include /www/server/panel/vhost/nginx/trpool-proxy.inc;
    }

    location / {
        include /www/server/panel/vhost/nginx/trpool-proxy.inc;
    }
}
