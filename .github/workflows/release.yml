name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆拿不到历史 tag，版本号会永远从 v0.0.1 开始
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # 本项目零外部依赖、没有 go.sum，开缓存只会得到
          # "Dependencies file is not found ... Supported file pattern: go.sum" 告警
          cache: false

      - name: Test
        run: go test ./... -count=1

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          BASE=${PREV:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${BASE#v}"
          # 去掉可能的预发布后缀，否则 $((PA+1)) 会报错
          PA="${PA%%[-+]*}"
          NEW="v${MA}.${MI}.$((PA + 1))"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "next=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:-<none>} -> Next: ${NEW}"

      - name: Build changelog
        env:
          PREV: ${{ steps.ver.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -z "${PREV}" ]; then RANGE=HEAD; else RANGE="${PREV}..HEAD"; fi
          {
            echo "## Changes"
            echo
            # 带逃生阀标记的提交本来就声明了"不发布"，别列进 Release 正文
            git log "$RANGE" --pretty='- %s (%h)' --no-merges \
              | grep -vF '[skip release]' | head -n 60 || true
            if [ -n "${PREV}" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${{ steps.ver.outputs.next }}"
            fi
          } > RELEASE_NOTES.md
          echo "--- notes ---"; cat RELEASE_NOTES.md

      - name: Build cross-platform binaries into dist/
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%%/*}
            GOARCH=${target##*/}
            EXT=''
            [ "$GOOS" = windows ] && EXT='.exe'
            echo "building ${GOOS}/${GOARCH}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/trpool-${GOOS}-${GOARCH}${EXT}" \
              ./cmd/trpool
          done

      - name: Verify artifacts
        run: |
          set -euo pipefail
          [ -n "$(ls -A dist)" ] || { echo "::error::dist/ is empty"; exit 1; }
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create tag
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.next }}'
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          # runner 上没有全局 git 身份，annotated tag 会以 128 退出
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.next }}'
          # 幂等：同一个 tag 重跑不应变红
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists -- skipping creation"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            dist/*

      - name: Move latest tag
        run: |
          set -euo pipefail
          git tag -f latest '${{ steps.ver.outputs.next }}'
          git push -f origin latest

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.ver.outputs.next }}
          path: dist/
          retention-days: 30

  image:
    # 发版成功才推镜像；逃生阀跳过 release 时这里会自动级联跳过
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          V='${{ needs.release.outputs.version }}'
          V="${V#v}"          # git tag 带 v，镜像 tag 不带
          echo "value=${V}" >> "$GITHUB_OUTPUT"
          echo "image tag: ${V}"

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION='${{ needs.release.outputs.version }}' \
            -t "${IMAGE}:${{ steps.tag.outputs.value }}" .

      - name: Smoke test before push
        run: |
          set -euo pipefail
          IMG="${IMAGE}:${{ steps.tag.outputs.value }}"
          docker run -d --name smoke -p 18087:8787 \
            -e TRPOOL_ADMIN_KEY=smoke-admin \
            -e TRPOOL_CLIENT_KEYS=sk-trpool-smoke "$IMG"
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18087/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "::error::/healthz 未在 40s 内就绪"; exit 1; }
          curl -fsS http://127.0.0.1:18087/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18087/v1/models)
          [ "$code" = "401" ] || { echo "::error::无密钥应为 401，实际 $code"; exit 1; }
          echo "smoke passed"

      - name: Push
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          V='${{ steps.tag.outputs.value }}'
          SHA=$(printf '%s' '${{ github.sha }}' | cut -c1-7)
          for t in "${IMAGE}:${V}" "${IMAGE}:latest" "${IMAGE}:sha-${SHA}"; do
            echo "pushing $t"
            docker push "$t" 2>&1 | tee -a /tmp/push.log
          done
          # 同一次构建推三个 tag，digest 必须唯一
          n=$(grep -o 'digest: sha256:[a-f0-9]*' /tmp/push.log | sort -u | wc -l)
          echo "distinct digests: $n"
          [ "$n" = "1" ] || { echo "::error::三个 tag 的 digest 不一致"; exit 1; }
          grep -o 'digest: sha256:[a-f0-9]*' /tmp/push.log | sort -u
